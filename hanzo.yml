# Hanzo CI/CD for hanzoai/elastic: .github/workflows/cicd.yml imports hanzoai/ci,
# which reads this file. The build door builds each image, one BuildKit Job
# per platform.
images:
  - name: elastic
    context: .
    dockerfile: Dockerfile
    repo: ghcr.io/hanzoai/elastic
    platforms: [linux/amd64]
